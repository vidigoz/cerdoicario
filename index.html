  drawSky(); drawParallax();
  drawTerrain();
  drawFarmScene(); drawPig(); drawParticles(dt);
  resultT += dt; statT += dt;
  const dist = Math.floor(pig.best/4);
  const total = dist + pig.points;
  const show = Math.min(1, resultT/0.5);

  panel(W/2-150, 30, 300, 148);
  if(pig.deathCause==='agua') text('¡CAYÓ AL AGUA!', W/2, 52, 9, PAL.red);
  else if(pig.deathCause==='choque' || pig.deathCause==='agua-choque') text('¡SE ESTRELLÓ EN PLENO VUELO!', W/2, 52, 8, PAL.red);
  else text('¡SE QUEDÓ SIN ENERGÍA!', W/2, 52, 9, PAL.red);
  // contadores animados
  const cDist = Math.floor(dist * Math.min(1, statT/1.2));
  const cPts  = Math.floor(pig.points * Math.min(1, Math.max(0,(statT-0.6))/1.2));
  const cTot  = Math.floor(total * Math.min(1, Math.max(0,(statT-1.4))/1.0));
  text('DISTANCIA', W/2-70, 80, 7, PAL.cream);  text(cDist+'m', W/2+70, 80, 9, PAL.pinkHi);
  text('PUNTOS',    W/2-70, 100, 7, PAL.cream); text(''+cPts,  W/2+70, 100, 9, PAL.carrot);
  cx.fillStyle = PAL.gold; cx.fillRect(W/2-120, 110, 240, 1);
  text('TOTAL',     W/2-70, 128, 8, PAL.gold);  text(''+cTot,  W/2+70, 128, 12, PAL.gold);

  if(newRecord && statT > 2.4 && (tGlobal*2|0)%2===0)
    text('★ ¡NUEVO RÉCORD REAL! ★', W/2, 150, 9, PAL.gold);
  if(statT > 2.4){
    text('TOCA: NUEVO LANZAMIENTO', W/2, 168, 7, PAL.cream);
  }
}

function drawRecords(){
  drawSky(); drawParallax(); camY = 40; drawTerrain();
  panel(W/2-160, 14, 320, 240);
  text('SALÓN DE LA FAMA', W/2, 32, 11, PAL.gold);
  text('RANKING MUNDIAL TOP 10', W/2, 46, 6, PAL.pinkHi);
  if(recordsLoading){
    text('Cargando ranking...', W/2, 130, 7, PAL.cream);
  } else if(records.length === 0){
    text('Aún no hay cerdos voladores...', W/2, 120, 6, PAL.cream);
    text('¡Sé el primero!', W/2, 136, 7, PAL.gold);
  } else {
    // columnas por posición X fija, alineadas con las filas de abajo (no
    // se puede alinear a espacios porque la fuente no es monoespaciada)
    const cPos = W/2-146, cFlag = W/2-124, cName = W/2-104, cDist = W/2+22, cPts = W/2+68, cTotal = W/2+140;
    text('POS', cPos, 58, 5, PAL.grassHi, false);
    text('NOMBRE', cName, 58, 5, PAL.grassHi, false);
    text('DIST', cDist, 58, 5, PAL.grassHi, false);
    text('PTS', cPts, 58, 5, PAL.grassHi, false);
    text('TOTAL', cTotal-cx.measureText('TOTAL').width, 58, 5, PAL.grassHi, false);
    for(let i=0;i<records.length;i++){
      const r = records[i], y = 70 + i*17;
      const col = i===0?PAL.gold:(i===1?'#cfd4e0':(i===2?'#d08a4a':PAL.cream));
      text((i+1)+'.', cPos, y, 7, col, false);
      flagText(countryToFlag(r.country), cFlag, y+4, 10, false);
      text(r.name, cName, y, 7, col, false);
      text(r.dist+'m', cDist, y, 6, col, false);
      text('+'+r.pts, cPts, y, 6, col, false);
      text(''+r.total, cTotal-cx.measureText(''+r.total).width, y, 7, col, false);
    }
  }
  text('TOCA PARA VOLVER', W/2, 262, 7, PAL.cream);
}

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
let last = performance.now();
resetTerrainInit();
function withZoom(fn){
  cx.save();
  cx.translate(W/2, H/2);
  cx.scale(zoom, zoom);
  cx.translate(-W/2, -H/2);
  fn();
  cx.restore();
}
function loop(now){
  let dt = Math.min(0.033, (now-last)/1000);
  last = now; tGlobal += dt;

  cx.save();
  if(shake > 0) cx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // bioma visible según el centro de la cámara
  BIO = BIOMES[biomeIndexAt(camX + W*0.5)];

  // engrane de ajustes: solo visible en menús, nunca durante el vuelo/catapulta
  const gearShown = (state===ST.TITLE || state===ST.DONE || state===ST.RECORDS);
  if(gearShown !== settingsGearShown){ settingsGearShown = gearShown; settingsGear.classList.toggle('show', gearShown); }
  // botón de salir del tutorial: solo visible mientras se está jugando el tutorial
  const skipShown = tutorialActive && (state===ST.LAUNCH || state===ST.PLAY);
  if(skipShown !== skipTutBtnShown){ skipTutBtnShown = skipShown; skipTutBtn.classList.toggle('show', skipShown); }
  // ranking: título y pantalla de resultados; tutorial: solo título — ambos
  // táctiles, sin atajos de teclado (el juego es para móvil)
  const rankingShown = state===ST.TITLE || (state===ST.DONE && statT > 2.4);
  const tutorialBtnShown = state===ST.TITLE;
  // guardar puntuación: solo en resultados, y solo mientras esta partida no
  // se haya guardado ya (evita mostrarlo de nuevo tras confirmar el nombre)
  const saveScoreShown = state===ST.DONE && statT > 2.4 && !recordSaved;
  if(rankingShown !== rankingBtnShownPrev || tutorialBtnShown !== tutorialBtnShownPrev || saveScoreShown !== saveScoreBtnShownPrev || state !== overlayBtnsStatePrev){
    rankingBtnShownPrev = rankingShown; tutorialBtnShownPrev = tutorialBtnShown; saveScoreBtnShownPrev = saveScoreShown; overlayBtnsStatePrev = state;
    rankingBtn.classList.toggle('show', rankingShown);
    tutorialBtn.classList.toggle('show', tutorialBtnShown);
    saveScoreBtn.classList.toggle('show', saveScoreShown);
    if(rankingShown || tutorialBtnShown || saveScoreShown) positionOverlayBtns();
  }

  switch(state){
    case ST.TITLE: drawTitle(); break;
    case ST.TUTORIAL: drawTutorialIntro(); break;
    case ST.LAUNCH:
      updateZoom(dt); updateCam(dt);
      withZoom(drawLaunch);
      break;
    case ST.PLAY: {
      physics(dt);
      // mientras el mundo está congelado esperando que suelten, nada se anima:
      // ni cámara, ni partículas, ni textos flotantes
      const dtLive = (tutorialActive && tutFrozen) ? 0 : dt;
      updateZoom(dtLive); updateCam(dtLive);
      withZoom(()=>{
        drawSky(); drawParallax();
        drawTerrain();
        drawItems();
        drawFarmScene(); drawObstacles(); drawPig(); drawParticles(dtLive);
      });
      drawHUD(); // el HUD nunca se escala, siempre nítido
      break;
    }
    case ST.DONE:
      updateZoom(dt); updateCam(dt);
      withZoom(()=>drawDone(dt));
      // ya NO salta solo al ranking tras unos segundos: con el botón
      // "GUARDAR PUNTUACIÓN" (ver openSaveScore), el jugador necesita
      // tiempo para decidir si guardar o no antes de que algo lo interrumpa
      break;
    case ST.RECORDS: drawRecords(); break;
  }
  cx.restore();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =====================================================================
   ENTRADA
   ===================================================================== */
const overlay = document.getElementById('nameOverlay');
const nameInput = document.getElementById('nameInput');
const countryInput = document.getElementById('countryInput');
const countryFlag = document.getElementById('countryFlag');
document.getElementById('nameOk').onclick = confirmName;
document.getElementById('nameSkip').onclick = closeNameOverlay;
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') countryInput.focus(); });
countryInput.addEventListener('input', ()=>{
  countryInput.value = countryInput.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,2);
  countryFlag.textContent = countryToFlag(countryInput.value);
});
countryInput.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmName(); });
// el nombre/país ya NO se piden para arrancar a jugar — solo cuando el
// jugador elige GUARDAR su puntuación al final (ver openSaveScore), para
// no llenar el ranking de nombres al azar de gente que solo quería probar
let recordSaved = false; // ya se guardó (o se descartó) el resultado de ESTA partida
function openSaveScore(){
  sfx.ui();
  overlay.style.display = 'flex';
  nameInput.value = playerName === 'SIR CERDO' ? '' : playerName;
  countryInput.value = playerCountry;
  countryFlag.textContent = countryToFlag(playerCountry);
  setTimeout(()=>nameInput.focus(), 50);
}
function closeNameOverlay(){ sfx.ui(); overlay.style.display = 'none'; }
async function confirmName(){
  const v = nameInput.value.trim().toUpperCase();
  const c = countryInput.value.trim().toUpperCase();
  playerName = v || 'SIR CERDO';
  playerCountry = /^[A-Z]{2}$/.test(c) ? c : 'MX';
  saveSavedPlayer(playerName, playerCountry);
  overlay.style.display = 'none';
  sfx.ui();
  // guarda el resultado de la partida que se acaba de jugar (ver finishRun,
  // que ya NO llama a addRecord automáticamente)
  const dist = pig.best/4;
  const isNew = await addRecord(playerName, playerCountry, dist, pig.points);
  recordSaved = true;
  if(state === ST.DONE){ newRecord = isNew; if(newRecord) sfx.record(); }
}

function press(){
  audio();
  musicRetryIfNeeded(); // reintenta si un play() anterior fue bloqueado por el navegador
  switch(state){
    case ST.TITLE:
      // el tap siempre entra directo al juego, nunca al tutorial — el
      // tutorial queda disponible solo desde su propio botón ("▶ TUTORIAL")
      // para que tocar la pantalla haga siempre lo mismo, sin sorpresas
      sfx.ui();
      startRun();
      break;
    case ST.TUTORIAL: sfx.ui(); startTutorial(); break;
    case ST.LAUNCH: doLaunch(); pressed = true; break;
    case ST.PLAY: pressed = true; break;
    case ST.DONE:
      if(statT > 2.4){
        sfx.ui();
        startRun();
      }
      break;
    case ST.RECORDS: sfx.ui(); state = ST.TITLE; break;
  }
}
function release(){ pressed = false; }
function openRecords(){ sfx.ui(); state = ST.RECORDS; loadRecords(); }

/* --- botón de omitir tutorial: visible solo mientras se juega el tutorial --- */
const skipTutBtn = document.getElementById('skipTutBtn');
skipTutBtn.addEventListener('click', e=>{
  e.stopPropagation();
  if(tutorialActive) endTutorial();
});

/* --- botones de ranking/tutorial en el título: todo el juego es táctil
   (sin teclado), así que cualquier acción secundaria necesita su propio
   botón físico en vez de un atajo de tecla. Se posicionan en JS siguiendo
   el rect real del canvas, para quedar alineados sin importar el zoom. --- */
const rankingBtn = document.getElementById('rankingBtn');
const tutorialBtn = document.getElementById('tutorialBtn');
rankingBtn.addEventListener('click', e=>{
  e.stopPropagation();
  if(state===ST.TITLE || (state===ST.DONE && statT > 2.4)) openRecords();
});
tutorialBtn.addEventListener('click', e=>{ e.stopPropagation(); if(state===ST.TITLE){ sfx.ui(); openTutorialIntro(); } });
const saveScoreBtn = document.getElementById('saveScoreBtn');
saveScoreBtn.addEventListener('click', e=>{
  e.stopPropagation();
  if(state===ST.DONE && statT > 2.4 && !recordSaved) openSaveScore();
});
function positionOverlayBtns(){
  const r = cv.getBoundingClientRect();
  const s = r.width / W; // factor de escala real del canvas en pantalla
  // el padding CSS es fijo y no escala solo con el canvas: en pantallas
  // chicas (s<1) eso los volvía más anchos que el hueco disponible. Se
  // escala fuente Y padding juntos, a tamaño de HUD (chico, como el resto
  // del texto del juego) en vez del tamaño de botón "real" que tenían antes.
  const fs = Math.max(5, 6*s);
  const padV = Math.max(2, 3*s), padH = Math.max(6, 10*s);
  for(const b of [rankingBtn, tutorialBtn]){
    b.style.fontSize = fs + 'px';
    b.style.padding = padV+'px '+padH+'px';
    b.style.width = 'auto'; // se resetea antes de medir, si no arrastra un ancho fijo de una pasada anterior
  }
  // "🏆 RANKING" y "▶ TUTORIAL" tienen distinto largo de texto, así que sin
  // esto cada botón se centraba con SU PROPIO ancho y quedaban con bordes
  // desalineados entre sí (se veían "descentrados" como par, aunque cada
  // uno individualmente sí estaba centrado). Se igualan al más ancho de
  // los dos para que compartan el mismo eje central.
  const maxW = Math.max(rankingBtn.offsetWidth, tutorialBtn.offsetWidth);
  rankingBtn.style.width = maxW + 'px';
  tutorialBtn.style.width = maxW + 'px';
  if(state === ST.DONE){
    // en resultados: GUARDAR PUNTUACIÓN (si aún no se guardó) y RANKING,
    // apilados bajo "TOCA: NUEVO LANZAMIENTO" (y=168) — mismo patrón que
    // el título, cada botón mide su propio ancho (textos bien distintos)
    saveScoreBtn.style.fontSize = fs + 'px';
    saveScoreBtn.style.padding = padV+'px '+padH+'px';
    const rowGap = 2*s;
    let rowY = r.top + 184*s;
    if(saveScoreBtnShownPrev){
      saveScoreBtn.style.top = rowY + 'px';
      saveScoreBtn.style.left = (r.left + r.width/2 - saveScoreBtn.offsetWidth/2) + 'px';
      rowY += saveScoreBtn.offsetHeight + rowGap;
    }
    rankingBtn.style.top = rowY + 'px';
    rankingBtn.style.left = (r.left + r.width/2 - rankingBtn.offsetWidth/2) + 'px';
  } else {
    // en el título, apilados uno sobre el otro (mismo ancho, mismo eje
    // central) bajo "TOCA PARA VOLAR" (y=152) y antes del panel del
    // ranking (que arranca en y=186): solo 34px lógicos de hueco para las
    // dos filas, así que van pegados al límite de arriba y con el gap más
    // chico posible entre ellos
    const rowY = r.top + 156*s;
    const rowGap = 2*s;
    const left = r.left + r.width/2 - maxW/2;
    rankingBtn.style.top = rowY + 'px';
    rankingBtn.style.left = left + 'px';
    tutorialBtn.style.top = (rowY + rankingBtn.offsetHeight + rowGap) + 'px';
    tutorialBtn.style.left = left + 'px';
  }
}

/* --- ajustes de audio: engrane + panel con sliders de volumen --- */
const settingsGear = document.getElementById('settingsGear');
const settingsOverlay = document.getElementById('settingsOverlay');
const sfxVolSlider = document.getElementById('sfxVol');
const musicVolSlider = document.getElementById('musicVol');
const sfxVolVal = document.getElementById('sfxVolVal');
const musicVolVal = document.getElementById('musicVolVal');
sfxVolSlider.value = Math.round(sfxVol*100);
musicVolSlider.value = Math.round(musicVol*100);
sfxVolVal.textContent = sfxVolSlider.value+'%';
musicVolVal.textContent = musicVolSlider.value+'%';
sfxVolSlider.addEventListener('input', ()=>{
  sfxVol = sfxVolSlider.value/100;
  sfxVolVal.textContent = sfxVolSlider.value+'%';
  try{ localStorage.setItem('cerdoicario-sfxvol', sfxVol); }catch(e){}
});
sfxVolSlider.addEventListener('change', ()=> beep(700,.05,'square',.08));
musicVolSlider.addEventListener('input', ()=>{
  musicVol = musicVolSlider.value/100;
  musicEl.volume = musicVol;
  musicVolVal.textContent = musicVolSlider.value+'%';
  try{ localStorage.setItem('cerdoicario-musicvol', musicVol); }catch(e){}
});
settingsGear.addEventListener('click', e=>{
  e.stopPropagation();
  settingsOverlay.classList.add('show');
});
document.getElementById('settingsClose').addEventListener('click', e=>{
  e.stopPropagation();
  settingsOverlay.classList.remove('show');
});
settingsOverlay.addEventListener('click', e=>{ if(e.target===settingsOverlay) settingsOverlay.classList.remove('show'); });

cv.addEventListener('mousedown', e=>{ e.preventDefault(); press(); });
addEventListener('mouseup', release);
cv.addEventListener('touchstart', e=>{ e.preventDefault(); press(); }, {passive:false});
cv.addEventListener('touchend', e=>{ e.preventDefault(); release(); }, {passive:false});
addEventListener('touchend', release);
addEventListener('keydown', e=>{
  if(overlay.style.display==='flex' || settingsOverlay.classList.contains('show')) return;
  if(e.code==='Space'){ e.preventDefault(); if(!pressed) press(); }
  if(e.key==='r' || e.key==='R'){ if(state===ST.TITLE || state===ST.DONE){ openRecords(); } }
  if(e.key==='t' || e.key==='T'){ if(state===ST.TITLE){ sfx.ui(); openTutorialIntro(); } }
  if(e.key==='Escape'){
    if(state===ST.TUTORIAL){ sfx.ui(); state = ST.TITLE; }
    else if(tutorialActive && (state===ST.LAUNCH || state===ST.PLAY)){ sfx.ui(); endTutorial(); }
  }
});
addEventListener('keyup', e=>{ if(e.code==='Space') release(); });
</script>
